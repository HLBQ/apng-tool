<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APNG 伪装图工坊</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__main">
      <h1 class="topbar__title">APNG 伪装图工坊</h1>
      <p class="topbar__sub">所有处理都在本地浏览器内完成，不上传任何文件</p>
    </div>
    <div class="topbar__meta mono" id="env-info">检测环境...</div>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab is-active" type="button" data-tab="analyze" role="tab">查看与导出</button>
    <button class="tab" type="button" data-tab="create" role="tab">制作伪装图</button>
  </nav>

  <main class="main">
    <section class="panel is-active" id="panel-analyze" role="tabpanel"></section>
    <section class="panel" id="panel-create" role="tabpanel"></section>
  </main>

  <div id="toast-host" class="toast-host"></div>
  <noscript>
    <div class="noscript">本工具需要启用 JavaScript 才能运行。</div>
  </noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
